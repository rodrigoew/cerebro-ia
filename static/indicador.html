<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Núcleo - indicador</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:12px/1 "Segoe UI",system-ui,sans-serif;color:#F1E7D2;user-select:none}
  .capsula{position:absolute;inset:3px;display:flex;align-items:center;gap:8px;padding:0 12px 0 6px;border-radius:20px;
    background:rgba(14,11,8,.72);border:1px solid rgba(217,168,69,.28);cursor:pointer;opacity:.45;transition:opacity .4s, border-color .4s}
  .capsula.ativa{opacity:1}
  .capsula:hover{opacity:1}
  canvas{width:26px;height:26px;flex:none}
  .rot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
</style>
</head>
<body>
<div class="capsula" id="capsula" title="Dois cliques abrem o Núcleo · arraste para mover">
  <canvas id="cv" width="52" height="52" aria-hidden="true"></canvas>
  <span class="rot" id="rot">Núcleo</span>
</div>
<script src="/static/js/indicador.js"></script>
</body>
</html>
